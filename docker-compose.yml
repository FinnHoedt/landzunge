services:
  backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - landzunge-dev

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - landzunge-dev

  admin:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    ports:
      - "5174:5174"
    env_file:
      - ./admin/.env
    depends_on:
      - backend
    networks:
      - landzunge-dev

volumes:
  backend_node_modules:
  frontend_node_modules:
  admin_node_modules:

networks:
  landzunge-dev:
    driver: bridge
